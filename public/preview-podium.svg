    <circle cx="53" cy="321" r="12" fill="#c9ced8"/><text x="49" y="326" font-weight="800" fill="#0c1222" font-size="12">2</text>
    <text x="120" y="326">Carla C.</text><text x="470" y="326">$1,251.81</text><text x="594" y="326">9</text><text x="660" y="326">$150 coupon</text>
    <rect x="24" y="342" width="752" height="1" fill="#e6e3da"/>
