  <rect x="24" y="256" width="752" height="1" fill="#e6e3da"/>
  <g font-size="14" fill="#141a2b">
    <circle cx="53" cy="278" r="12" fill="#e3b341"/><text x="49" y="283" font-weight="800" fill="#0c1222" font-size="12">1</text>
    <text x="120" y="283">Lena L.</text><text x="470" y="283">$3,831.82</text><text x="590" y="283">29</text><text x="660" y="283">$300 coupon</text>
