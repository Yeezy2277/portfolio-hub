<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="450" fill="#f6f4ee"/>
  <!-- navy app bar with gold rule -->
  <rect width="800" height="54" fill="#16223f"/>
  <rect y="54" width="800" height="3" fill="#e3b341"/>
  <rect x="24" y="23" width="8" height="13" rx="1" fill="#c9ced8"/><rect x="34" y="15" width="8" height="21" rx="1" fill="#e3b341"/><rect x="44" y="27" width="8" height="9" rx="1" fill="#c98a52"/>
  <text x="60" y="35" fill="#fff" font-size="19" font-weight="800" letter-spacing="-0.4">Podium</text>
  <text x="138" y="34" fill="#c8ccd6" font-size="10.5" font-weight="600" letter-spacing="1.2">ACME OUTFITTERS</text>
