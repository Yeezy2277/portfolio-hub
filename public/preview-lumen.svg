<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="Newsreader, 'Iowan Old Style', Georgia, serif">
  <rect width="800" height="450" fill="#f4efe4"/>
  <text x="32" y="46" fill="#1a1714" font-size="32" font-weight="800" font-style="italic" font-family="Fraunces, Georgia, serif" letter-spacing="-1">Lumen</text>
  <text x="138" y="44" fill="#b3121f" font-size="10" letter-spacing="2" font-family="'IBM Plex Mono', monospace">THE REVIEW</text>
  <text x="620" y="44" fill="#655c50" font-size="10" letter-spacing="2" font-family="'IBM Plex Mono', monospace">ARTICLES</text>
  <rect x="0" y="62" width="800" height="2" fill="#1a1714"/><rect x="0" y="67" width="800" height="1" fill="#1a1714"/>
  <text x="32" y="100" fill="#b3121f" font-size="10" letter-spacing="2" font-family="'IBM Plex Mono', monospace">THE LUMEN REVIEW · FRONT PAGE</text>
  <text x="32" y="150" fill="#1a1714" font-size="44" font-weight="300" font-family="Fraunces, Georgia, serif" letter-spacing="-1.5">Writing on <tspan font-weight="800" font-style="italic" fill="#b3121f">craft</tspan>, systems,</text>
  <text x="32" y="196" fill="#1a1714" font-size="44" font-weight="300" font-family="Fraunces, Georgia, serif" letter-spacing="-1.5">and the work behind the screen.</text>
  <text x="32" y="226" fill="#3b342c" font-size="15" font-style="italic">A demo publication powered by a headless CMS.</text>
  <rect x="32" y="244" width="736" height="1" fill="#d8cfbe"/>
  <rect x="32" y="262" width="736" height="4" fill="#1a1714"/>
  <rect x="32" y="276" width="400" height="150" fill="#fbf8f1"/>
  <g stroke="#d8cfbe"><line x1="32" y1="300" x2="432" y2="300"/><line x1="32" y1="324" x2="432" y2="324"/><line x1="32" y1="348" x2="432" y2="348"/><line x1="32" y1="372" x2="432" y2="372"/><line x1="32" y1="396" x2="432" y2="396"/></g>
  <text x="196" y="402" fill="#b3121f" font-size="130" font-weight="800" font-style="italic" font-family="Fraunces, Georgia, serif">W</text>
  <text x="456" y="296" fill="#b3121f" font-size="10" letter-spacing="2" font-family="'IBM Plex Mono', monospace">SYSTEMS</text>
  <text x="456" y="334" fill="#1a1714" font-size="30" font-weight="800" font-family="Fraunces, Georgia, serif" letter-spacing="-1">When a webhook</text>
  <text x="456" y="366" fill="#1a1714" font-size="30" font-weight="800" font-family="Fraunces, Georgia, serif" letter-spacing="-1">calls itself</text>
  <text x="456" y="394" fill="#3b342c" font-size="14" font-style="italic">A sync job writes back to the CMS, and the</text>
  <text x="456" y="412" fill="#3b342c" font-size="14" font-style="italic">loop runs all night. How to design it out.</text>
</svg>
