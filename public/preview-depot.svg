<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#93a4ad" fill-opacity="0.22"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="800" height="230" fill="url(#fade)"/></mask></defs>
  <rect width="800" height="450" fill="#0f1519"/>
  <rect width="800" height="230" fill="url(#dots)" mask="url(#m)"/>
  <text x="40" y="52" fill="#2dd4bf" font-size="12" font-family="'Fira Code', monospace"><tspan fill="#93a4ad">$ </tspan>backend · api · postgres</text>
  <text x="40" y="130" fill="#e3eaed" font-size="72" font-weight="800" letter-spacing="-2">Depot</text>
  <text x="40" y="166" fill="#93a4ad" font-size="16" font-family="'Fira Code', monospace"><tspan fill="#2dd4bf" font-weight="500">GET</tspan> /api/v1/<tspan fill="#2dd4bf">:collection</tspan>/:slug</text>
  <rect x="40" y="188" width="128" height="34" fill="#2dd4bf"/><text x="56" y="210" fill="#04211d" font-size="14" font-weight="500">Admin console</text>
  <rect x="178" y="188" width="112" height="34" fill="none" stroke="#26323b"/><text x="194" y="210" fill="#e3eaed" font-size="14" font-weight="500">Source code</text>
  <rect x="40" y="240" width="720" height="1" fill="#26323b"/>
  <rect x="40" y="260" width="348" height="160" fill="#0a1013" stroke="#26323b"/><rect x="40" y="260" width="3" height="160" fill="#2dd4bf"/>
  <g font-family="'Fira Code', monospace" font-size="12">
    <text x="58" y="290" fill="#93a4ad" fill-opacity="0.6">1</text><text x="80" y="290" fill="#cbd5d8">curl …/api/v1/articles \</text>
    <text x="58" y="314" fill="#93a4ad" fill-opacity="0.6">2</text><text x="80" y="314" fill="#cbd5d8">  -H "Authorization: Bearer depot_…"</text>
    <text x="58" y="338" fill="#93a4ad" fill-opacity="0.6">3</text>
    <text x="58" y="362" fill="#93a4ad" fill-opacity="0.6">4</text><text x="80" y="362" fill="#93a4ad"># → { "data": [ { "slug": … } ] }</text>
  </g>
  <rect x="404" y="260" width="356" height="160" fill="#161e24" stroke="#26323b"/>
  <g font-family="'Fira Code', monospace" font-size="11">
    <text x="420" y="284" fill="#93a4ad" font-size="9" letter-spacing="1.5">METHOD   PATH</text>
    <rect x="420" y="296" width="44" height="18" fill="#f2b45a" fill-opacity="0.12" stroke="#f2b45a"/><text x="428" y="309" fill="#f2b45a">POST</text><text x="478" y="309" fill="#e3eaed">/api/auth/login</text>
    <rect x="420" y="324" width="44" height="18" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf"/><text x="432" y="337" fill="#2dd4bf">GET</text><text x="478" y="337" fill="#e3eaed">/api/collections</text>
    <rect x="420" y="352" width="44" height="18" fill="#f2b45a" fill-opacity="0.12" stroke="#f2b45a"/><text x="425" y="365" fill="#f2b45a">PATCH</text><text x="478" y="365" fill="#e3eaed">/api/items/:id</text>
    <rect x="420" y="380" width="44" height="18" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf"/><text x="432" y="393" fill="#2dd4bf">GET</text><text x="478" y="393" fill="#e3eaed">/api/v1/:collection</text>
  </g>
</svg>
