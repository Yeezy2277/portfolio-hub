    <circle cx="340" cy="262" r="16" fill="#ff5a4f" fill-opacity="0.18" stroke="#ff5a4f" stroke-width="1.5"/><circle cx="340" cy="262" r="26" fill="none" stroke="#ff5a4f" stroke-opacity="0.4"/><text x="340" y="296">EU-CENTRAL</text>
    <circle cx="440" cy="340" r="13" fill="#46d68a" fill-opacity="0.18" stroke="#46d68a" stroke-width="1.5"/><text x="440" y="372">APAC</text>
