    <rect x="212" y="70" width="176" height="70" fill="#141815" stroke="#1d2420"/><text x="224" y="90" fill="#97a39b" font-size="9" letter-spacing="1.6">MATCHES / MIN</text><text x="224" y="120" fill="#e4ece6" font-size="22" font-weight="700">2,573</text>
    <rect x="400" y="70" width="176" height="70" fill="#141815" stroke="#1d2420"/><text x="412" y="90" fill="#97a39b" font-size="9" letter-spacing="1.6">CREDITS / MIN</text><text x="412" y="120" fill="#e4ece6" font-size="22" font-weight="700">292,690</text>
    <rect x="588" y="70" width="188" height="70" fill="#141815" stroke="#1d2420"/><text x="600" y="90" fill="#97a39b" font-size="9" letter-spacing="1.6">P95 LATENCY</text><text x="600" y="120" fill="#ff5a4f" font-size="22" font-weight="700">332 ms</text>
    <polyline points="36,134 60,130 84,132 108,126 132,128 156,122 188,120" fill="none" stroke="#3fd6e4" stroke-width="1.5"/>
    <polyline points="600,134 640,132 680,128 720,118 764,104" fill="none" stroke="#ff5a4f" stroke-width="1.5"/>
  </g>
