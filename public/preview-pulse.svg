  <rect x="24" y="154" width="500" height="280" fill="#101411" stroke="#1d2420"/>
  <g fill="none" stroke="#1d2420"><circle cx="274" cy="294" r="60"/><circle cx="274" cy="294" r="120"/><circle cx="274" cy="294" r="180"/><line x1="24" y1="294" x2="524" y2="294"/><line x1="274" y1="154" x2="274" y2="434"/></g>
  <path d="M274 294 L454 214 A200 200 0 0 1 474 294 Z" fill="#3fd6e4" opacity="0.08"/>
  <line x1="274" y1="294" x2="454" y2="214" stroke="#3fd6e4" opacity="0.5"/>
  <g font-size="11" font-weight="600" fill="#e4ece6" text-anchor="middle">
