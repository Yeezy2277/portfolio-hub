    <rect x="550" y="188" width="212" height="40" fill="#1a1110" stroke="#ff5a4f"/><text x="560" y="205" fill="#ff5a4f">CRITICAL</text><text x="560" y="220" fill="#e4ece6">Region down · EU-Central</text>
    <rect x="550" y="236" width="212" height="40" fill="#1a1608" stroke="#ffb020"/><text x="560" y="253" fill="#ffb020">WARN</text><text x="560" y="268" fill="#e4ece6">High latency · EU-North</text>
    <text x="550" y="306" fill="#97a39b" font-size="9" letter-spacing="1.6">INCIDENT CONTROLS</text>
    <rect x="550" y="316" width="100" height="26" fill="none" stroke="#3a443e"/><text x="560" y="333" fill="#e4ece6">Latency spike</text>
    <rect x="660" y="316" width="102" height="26" fill="none" stroke="#3a443e"/><text x="670" y="333" fill="#e4ece6">Take offline</text>
    <rect x="550" y="350" width="100" height="26" fill="none" stroke="#3a443e"/><text x="560" y="367" fill="#e4ece6">Step 1 tick</text>
