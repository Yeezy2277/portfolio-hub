  <circle cx="38" cy="36" r="13" fill="none" stroke="#ffb020" stroke-width="2"/><rect x="26" y="35" width="24" height="2" fill="#ffb020"/>
  <text x="62" y="35" fill="#ffb020" font-size="20" font-weight="700" letter-spacing="6">PULSE</text>
  <text x="62" y="51" fill="#97a39b" font-size="10" letter-spacing="2" font-family="'JetBrains Mono', monospace">LIVE OPS CONSOLE · SEED 4242</text>
  <rect x="566" y="22" width="150" height="26" fill="none" stroke="#ffb020"/><circle cx="580" cy="35" r="4" fill="#ffb020"/><text x="590" y="40" fill="#ffb020" font-size="11" letter-spacing="1.5" font-family="'JetBrains Mono', monospace">INCIDENTS ACTIVE</text>
  <!-- metrics -->
  <g font-family="'JetBrains Mono', monospace">
